name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Vercel CLI сам зовёт pnpm по packageManager из package.json,
      # а на раннере его нет — ставим ту же версию, что в lock-файле.
      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Страховка: если Next-роуты вдруг снова не попали в сборку,
      # падаем здесь, а не выкатываем на прод пустую статику.
      - name: Verify Next.js output
        run: |
          # Сборщик @vercel/next должен реально отработать. При framework=null
          # Vercel публикует только public/ — прод тогда отдаёт 404 на всех роутах.
          grep -q '"use": "@vercel/next"' .vercel/output/builds.json \
            || { echo "::error::сборку делал не @vercel/next — проверь framework в vercel.json"; exit 1; }
          # Роут «/» существует либо как статика, либо как функция (App Router).
          if [ ! -f .vercel/output/static/index.html ] && [ ! -e .vercel/output/functions/index.func ] \
             && [ ! -f .vercel/output/functions/index.prerender-fallback.html ]; then
            echo "::error::корневой роут отсутствует в .vercel/output"
            find .vercel/output -maxdepth 2 | head -40
            exit 1
          fi
          echo "output OK"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
