name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Vercel CLI сам зовёт pnpm по packageManager из package.json,
      # а на раннере его нет — ставим ту же версию, что в lock-файле.
      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: DEBUG list build output
        run: |
          echo "--- settings ---"
          cat .vercel/project.json | head -40
          echo "--- output tree (depth 4) ---"
          find .vercel/output -maxdepth 4 | head -100
          echo "--- total size ---"
          du -sh .vercel/output
          echo "--- index.html present? ---"
          ls -la .vercel/output/static/index.html || echo "NO index.html"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
