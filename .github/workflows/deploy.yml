name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Vercel CLI сам зовёт pnpm по packageManager из package.json,
      # а на раннере его нет — ставим ту же версию, что в lock-файле.
      - name: Install pnpm
        run: npm install --global pnpm@9.15.9

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Страховка: если Next-роуты вдруг снова не попали в сборку,
      # падаем здесь, а не выкатываем на прод пустую статику.
      - name: Verify Next.js output
        run: |
          echo "--- pulled settings ---"
          sed -e 's/"projectId".*/"projectId": "***",/' -e 's/"orgId".*/"orgId": "***",/' .vercel/project.json
          echo "--- output tree ---"
          find .vercel/output -maxdepth 3 | head -60
          echo "--- builds.json ---"
          cat .vercel/output/builds.json 2>/dev/null | head -40
          test -f .vercel/output/static/index.html \
            || { echo "::error::index.html отсутствует — framework определился не как nextjs"; exit 1; }

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
